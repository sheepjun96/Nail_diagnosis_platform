services:
  db:
    ports:
      - "127.0.0.1:${NAIL_DB_PORT:-3308}:3306"
  redis:
    ports:
      - "127.0.0.1:${NAIL_REDIS_PORT:-6380}:6379"
  app:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--no-access-log"]
    environment:
      NAIL_ENABLE_DOCS: "true"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./main.py:/app/main.py:ro
      - ./auth.py:/app/auth.py:ro
      - ./config.py:/app/config.py:ro
      - ./db.py:/app/db.py:ro
      - ./router:/app/router:ro
      - ./services:/app/services:ro
  frontend:
    build:
      target: development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./nail_front:/app
      - nail_front_node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci && npm run dev -- --port 3000 --hostname 0.0.0.0"]
    mem_limit: 2g
volumes:
  nail_front_node_modules:
