version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: curaxel_skin
      MYSQL_USER: curaxel_user
      MYSQL_PASSWORD: curaxel_pass
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init_env.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: curaxel_user
      DB_PASSWORD: curaxel_pass
      DB_NAME: curaxel_skin
      GACHON_AUTH_DB_HOST: ${GACHON_AUTH_DB_HOST:-host.docker.internal}
      GACHON_AUTH_DB_PORT: ${GACHON_AUTH_DB_PORT:-3306}
      GACHON_AUTH_DB_USER: ${GACHON_AUTH_DB_USER:-}
      GACHON_AUTH_DB_PASSWORD: ${GACHON_AUTH_DB_PASSWORD:-}
      GACHON_AUTH_DB_NAME: ${GACHON_AUTH_DB_NAME:-mis_db}
      GACHON_REDIS_HOST: ${GACHON_REDIS_HOST:-host.docker.internal}
      GACHON_REDIS_PORT: ${GACHON_REDIS_PORT:-6379}
      GACHON_SESSION_SECRET: ${GACHON_SESSION_SECRET:-}
      GACHON_BASE_URL: ${GACHON_BASE_URL:-http://localhost:3000}
      NAIL_APP_BASE_PATH: ${NAIL_APP_BASE_PATH:-/v2/app}
    volumes:
      - ./ai_models:/app/ai_models
      - ./static:/app/static
      - curaxel_images:/curaxel_images
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./nail_front
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/v2}
      NEXT_PUBLIC_API_BASE_URL: /api
      INTERNAL_API_BASE_URL: http://app:8001/api
      INTERNAL_API_PROXY_TARGET: http://app:8001/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev", "--", "-p", "3000"]
    volumes:
      - ./nail_front:/app
      - nail_front_node_modules:/app/node_modules
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${NAIL_HTTP_PORT:-3007}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static:/app/static
      - curaxel_images:/curaxel_images
    depends_on:
      - app
      - frontend
    
volumes:
  db_data:
  curaxel_images:
  hf_cache:
  nail_front_node_modules:
