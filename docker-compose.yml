services:
  db:
    image: mysql:8.0
    container_name: curaxel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: curaxel_skin
      MYSQL_USER: curaxel_user
      MYSQL_PASSWORD: curaxel_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: curaxel_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: curaxel_user
      DB_PASSWORD: curaxel_pass
      DB_NAME: curaxel_skin
    volumes:
      - ./static:/static
      - C:/curaxel:/curaxel_images
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - db

