pid /tmp/nginx.pid;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    sendfile on;
    client_max_body_size 50m;
    client_body_timeout 60s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    log_format platform '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout platform;
    error_log /dev/stderr warn;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 620s;
    server {
        listen 80;
        set $app_upstream http://app:8001;
        set $frontend_upstream http://frontend:3000;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location /api/ { proxy_pass $app_upstream; }
        location /health/ { proxy_pass $app_upstream; }
        location /images/ { proxy_pass $app_upstream; }
        location /static/bootstrap/ { proxy_pass $app_upstream; }
        location /static/ { return 404; }
        location = /docs { proxy_pass $app_upstream; }
        location = /openapi.json { proxy_pass $app_upstream; }
        location = /app { proxy_pass $app_upstream; }
        location /app/ { proxy_pass $app_upstream; }
        location = /send_patient_data { proxy_pass $app_upstream; }
        location /viewer/ { proxy_pass $app_upstream; }
        location /upload-hand-image/ { proxy_pass $app_upstream; }
        location = / { proxy_pass $app_upstream; }
        location / { proxy_pass $frontend_upstream; }
    }
}
