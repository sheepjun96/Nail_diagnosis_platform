[project]
name = "nail-platform"
version = "0.2.0"
description = "Curaxel nail imaging platform and independent inference service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.35,<1",
    "aiomysql==0.3.2",
    "cryptography>=46,<50",
    "PyJWT>=2.10,<3",
    "redis>=6.4,<7",
    "httpx>=0.28,<1",
    "pillow>=11.3,<13",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
ai = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.1",
    "ultralytics==8.3.232",
    "safetensors>=0.6,<1",
    "numpy>=1.26,<3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
