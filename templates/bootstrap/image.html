<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        img {
            max-width: none;
            max-height: none;
            transform-origin: center center;
            transition: transform 0.05s linear;
        }
    </style>
</head>
<body>
    {% if filename %}
        <img id="zoomImg" src="{{ filename }}" alt="image" />
    {% else %}
        <div style="color:#fff;">표시할 이미지가 없습니다.</div>
    {% endif %}
    <script>
        document.addEventListener("DOMContentLoaded", function () {
        const img = document.getElementById("zoomImg");
        if (!img) return;

        let scale = 1;
        let posX = 0;
        let posY = 0;

        let isPanning = false;
        let startX = 0;
        let startY = 0;

        function updateTransform() {
            img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        // 🔍 마우스 휠로 Zoom In/Out
        window.addEventListener(
            "wheel",
            function (e) {
            e.preventDefault(); // 기본 스크롤 막기

            // deltaY < 0 : 위로 스크롤 → 확대
            if (e.deltaY < 0) {
                scale += 0.1;
                if (scale > 10) scale = 10; // 너무 과한 확대 방지
            } else {
                scale -= 0.1;
                if (scale < 0.2) scale = 0.2; // 너무 축소 방지
            }

            updateTransform();
            },
            { passive: false }
        );

        // 🖱 가운데 버튼(middle) 눌렀을 때 panning 시작
        img.addEventListener("mousedown", function (e) {
            if (e.button === 1) {  // 0: left, 1: middle, 2: right
            e.preventDefault();  // 브라우저 기본 auto-scroll 막기
            isPanning = true;
            img.style.cursor = "grabbing";

            // 현재 마우스 위치와 이미지 offset 차이 저장
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            }
        });

        // 이동 처리 (전체 창 기준으로)
        window.addEventListener("mousemove", function (e) {
            if (!isPanning) return;

            e.preventDefault();
            posX = e.clientX - startX;
            posY = e.clientY - startY;

            updateTransform();
        });

        // 버튼 떼면 panning 종료
        window.addEventListener("mouseup", function (e) {
            if (e.button === 1 && isPanning) {
            isPanning = false;
            img.style.cursor = "grab";
            }
        });

        // 창 밖으로 나갔다 들어올 때도 끊어주기 (안전용)
        window.addEventListener("mouseleave", function () {
            if (isPanning) {
            isPanning = false;
            img.style.cursor = "grab";
            }
        });
        });
    </script>
</body>
</html>
